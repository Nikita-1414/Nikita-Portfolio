<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO Meta Tags -->
    <title>Nikita — Full Stack Developer & UX Designer</title>
    <meta name="description" content="Portfolio of Nikita, a full-stack developer building scalable MERN stack applications with AI/ML integration and clean UX." />
    <meta name="keywords" content="Nikita, full stack developer, MERN stack, React, Next.js, Node.js, MongoDB, AI ML, Python, UX designer" />
    <meta name="author" content="Nikita" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Nikita — Full Stack Developer & UX Designer" />
    <meta property="og:description" content="Portfolio of Nikita, a full-stack developer building scalable MERN stack applications with AI/ML integration and clean UX." />
    <meta property="og:site_name" content="Nikita Portfolio" />
    <meta property="og:image" content="https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&w=800&q=80" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nikita — Full Stack Developer & UX Designer" />
    <meta name="twitter:description" content="Portfolio of Nikita, a full-stack developer building scalable MERN stack applications with AI/ML integration and clean UX." />

    <!-- Preconnect for Google Fonts performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- JSON-LD Structured Data Schema (SEO) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "@id": "https://nikita-portfolio.pages.dev/#person",
            "name": "Nikita",
            "jobTitle": "Full Stack Developer",
            "description": "Full Stack Developer specializing in MERN stack applications, REST APIs, and AI/ML integration.",
            "url": "https://nikita-portfolio.pages.dev"
          },
          {
            "@type": "WebSite",
            "@id": "https://nikita-portfolio.pages.dev/#website",
            "url": "https://nikita-portfolio.pages.dev",
            "name": "Nikita Portfolio",
            "publisher": {
              "@id": "https://nikita-portfolio.pages.dev/#person"
            }
          }
        ]
      }
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
